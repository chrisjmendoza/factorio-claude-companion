[mod-name]
ClaudeCompanion=Claude Companion

[mod-description]
ClaudeCompanion=Play a map together with Claude. Chat goes to Claude and Claude answers in game chat; Claude reads the map and lays down builds as ghosts for your robots to construct.

[mod-setting-name]
claude-companion-chat-mode=Chat passed to Claude
claude-companion-allow-cheats=Allow Claude to use cheats

[mod-setting-description]
claude-companion-chat-mode=all: every chat line. mentions: only lines that mention Claude. command: only /claude messages.
claude-companion-allow-cheats=Lets Claude run Lua in the game and place buildings instantly instead of as ghosts. Turns off achievements like any console command. Anything on this PC that can reach the game's UDP port could use it too.

[string-mod-setting]
claude-companion-chat-mode-all=Everything
claude-companion-chat-mode-mentions=Lines that mention Claude
claude-companion-chat-mode-command=Only /claude

[command-help]
claude=Send a message to Claude.
claude-follow=Follow Claude's character with your view. Run it again, or press Esc, to come back.
claude-watch=Open or close a small camera window that follows Claude's character. Give a number to set its zoom, e.g. /claude-watch 0.3
